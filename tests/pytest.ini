[tool:pytest]
# Pytest configuration for sofIA test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components
    e2e: End-to-end tests for complete user journeys
    slow: Tests that take longer than 5 seconds to run
    api: Tests for API endpoints and HTTP interfaces
    database: Tests that require database connectivity
    whatsapp: Tests for WhatsApp integration
    subscription: Tests for subscription management features
    payment: Tests for payment processing
    agent: Tests for AI agent functionality
    mock: Tests that use mock data only
    
# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Coverage configuration (if pytest-cov is installed)
# addopts = --cov=sofIA --cov=orchestrator --cov-report=html --cov-report=term

# Asyncio configuration
asyncio_mode = auto

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filterwarnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.*
    ignore::UserWarning:supabase.*
