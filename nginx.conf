events {
    worker_connections 1024;
}

http {
    upstream sofia_backend {
        server sofia-payment-agent:8000;
    }

    upstream whatsapp_bridge {
        # WhatsApp bridge is now deployed separately
        # server whatsapp-bridge:3001;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # sofIA Payment Agent API
        location / {
            proxy_pass http://sofia_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WhatsApp webhook timeout
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # WhatsApp Bridge API
        location /bridge/ {
            rewrite ^/bridge/(.*) /$1 break;
            proxy_pass http://whatsapp_bridge;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WhatsApp QR Code Interface - Direct Access
        location /qr {
            proxy_pass http://whatsapp_bridge/qr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WhatsApp QR Code Image
        location /qr-image {
            proxy_pass http://whatsapp_bridge/qr-image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoints
        location /health {
            proxy_pass http://sofia_backend/health;
            access_log off;
        }

        location /bridge/health {
            proxy_pass http://whatsapp_bridge/health;
            access_log off;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }
}
