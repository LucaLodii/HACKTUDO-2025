services:
  - type: web
    name: sofia-whatsapp-bridge
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1024"
      - key: PORT
        value: 3001
      - key: SOFIA_API_URL
        value: "https://sofia-payment-agent-2.onrender.com"
      - key: DISPLAY
        value: ":99"
    healthCheckPath: /health
    disk:
      name: whatsapp-auth
      mountPath: /app/.wwebjs_auth
      sizeGB: 1