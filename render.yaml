services:
  # sofIA Payment Agent (Python FastAPI)
  - type: web
    name: sofia-payment-agent
    env: python
    plan: starter
    buildCommand: |
      pip install uv
      uv sync --frozen
    startCommand: uv run app.py
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: AGENT_ID
        value: sofia-whatsapp-agent
      - key: MERCHANT_ID
        value: sofia-merchant
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

# WhatsApp Bridge is now deployed separately
# See: sofIA-Whatsapp-Websocket repository

